[window]
dynamic_padding = true
opacity = 0.9

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"
[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"
[[keyboard.bindings]]
key = "Space"
mods = "Control"
action = "ToggleViMode"

[font]
size = 16
[font.normal]
family = "JetBrainsMono NerdFont"
style = "Regular"
[font.italic]
family = "JetBrainsMono NerdFont"
style = "Italic"
[font.bold]
family = "JetBrainsMono NerdFont"
style = "Bold"
[font.bold_italic]
family = "JetBrainsMono NerdFont"
style = "Bold Italic"

[colors.primary]
background = '#000000'
foreground = "#a9b1d6"
[colors.normal]
black = "#32344a"
blue = "#7aa2f7"
cyan = "#449dab"
green = "#9ece6a"
magenta = "#ad8ee6"
red = "#f7768e"
white = "#787c99"
yellow = "#e0af68"
[colors.bright]
black = "#444b6a"
blue = "#7da6ff"
cyan = "#0db9d7"
green = "#b9f27c"
magenta = "#bb9af7"
red = "#ff7a93"
white = "#acb0d0"
yellow = "#ff9e64"
[colors.selection]
text   = '#c0caf5'
background = '#28344a'
